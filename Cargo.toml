[package]
name = "water-remainder"
version = "0.10.0"
edition = "2024"
authors = ["cz-97"]

# 让警告有牙齿：clippy 现在就是干净的，这里把它钉住，以后新增的警告会在
# `cargo clippy` 里直接报错，而不是被淹没在输出里慢慢堆积。
[lints.clippy]
all = { level = "deny", priority = -1 }
correctness = "deny"
suspicious = "deny"
perf = "warn"

# `unsafe` 全部集中在 `platform/mod.rs`，本项目用它调 Win32；那个文件是唯一
# 允许出现 unsafe 的地方。这里不全局开 `unsafe_code` 警告——15 处调用只会刷出
# 同样多的噪音，把真警告淹掉。

[dependencies]
gpui-kit = { version = "0.7", default-features = false }
tray-icon = "0.26"
raw-window-handle = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-channel = "0.3"
futures-util = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
] }
