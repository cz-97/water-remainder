[package]
name = "water-remainder"
version = "0.5.1"
edition = "2024"
authors = ["cz-97"]

[dependencies]
gpui-kit = { version = "0.6", default-features = false, features = ["component", "assets"] }
# gpui-component 0.6.1 与 gpui-component-macros 0.6.2+ 不兼容（IntoPlot 派生会引用
# 0.6.1 里不存在的 plot API，导致组件自身编译失败）。Cargo.lock 未纳入版本控制，
# 故在 Cargo.toml 里把宏版本钉死。
gpui-component-macros = "=0.6.1"
tray-icon = "0.19"
raw-window-handle = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-channel = "0.3"
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.31"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"
